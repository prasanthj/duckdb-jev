name: Native CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      JEV_BUILD_JOBS: '4'
      JEV_RUN_LIVE: '0'
      UV_PYTHON: '3.11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libcurl4-openssl-dev
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Build
        run: ./build.sh
      - name: Test and analyze
        run: |
          uv run pytest -q --junitxml=test-results.xml
          uv run ruff check tests benchmarks scripts examples
          uv run pyright tests benchmarks scripts examples
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-ci-tests
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14

  sanitizer:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            compile_flags: -fsanitize=address,undefined -fno-omit-frame-pointer
            runtime_library: libasan.so
            pytest_args: tests
            runtime_options: detect_leaks=0:halt_on_error=1
          - name: TSan
            compile_flags: -fsanitize=thread -fno-omit-frame-pointer
            runtime_library: libtsan.so
            pytest_args: tests/test_performance.py tests/test_stream.py tests/test_query_cache.py
            runtime_options: halt_on_error=1
    env:
      JEV_BUILD_JOBS: '2'
      JEV_RUN_LIVE: '0'
      UV_PYTHON: '3.11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libcurl4-openssl-dev
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Build instrumented extension
        env:
          FLAGS: ${{ matrix.compile_flags }}
        run: |
          ./build.sh -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="$FLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="$FLAGS" \
            -DDISABLE_VPTR_SANITIZER=TRUE
      - name: Run instrumented tests
        env:
          RUNTIME_LIBRARY: ${{ matrix.runtime_library }}
          RUNTIME_OPTIONS: ${{ matrix.runtime_options }}
          PYTEST_ARGS: ${{ matrix.pytest_args }}
        run: |
          runtime="$(c++ -print-file-name="$RUNTIME_LIBRARY")"
          test -f "$runtime"
          if [[ "$RUNTIME_LIBRARY" == "libasan.so" ]]; then
            export ASAN_OPTIONS="$RUNTIME_OPTIONS"
          else
            export TSAN_OPTIONS="$RUNTIME_OPTIONS"
          fi
          # Keep uv's own Tokio worker threads outside the sanitizer process.
          LD_PRELOAD="$runtime" .venv/bin/python -m pytest -q $PYTEST_ARGS
