name: Native CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      JEV_BUILD_JOBS: '4'
      JEV_RUN_LIVE: '0'
      UV_PYTHON: '3.11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libcurl4-openssl-dev
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Build
        run: ./build.sh
      - name: Test and analyze
        run: |
          uv run pytest -q --junitxml=test-results.xml
          uv run ruff check tests benchmarks scripts examples
          uv run pyright tests benchmarks scripts examples
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-ci-tests
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14
