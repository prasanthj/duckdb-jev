[project]
name = "duckdb-jev-tests"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["duckdb==1.5.5"]
[dependency-groups]
dev = [
    "pytest>=8,<10",
 "cmake>=3.30,<4",
 "ninja>=1.11",
 "ruff>=0.12",
 "pyright>=1.1",
 "clang-format>=23.1.1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 120
[tool.pyright]
typeCheckingMode = "basic"
extraPaths = ["tests"]
exclude = ["vendor", "build", ".venv"]
